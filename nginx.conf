# ── Frontend Nginx Template ─────────────────────────────────────────────────
# Used as a template by the frontend Dockerfile.prod (envsubst for ${DOMAIN})
# This config is for the standalone frontend container; when deployed with
# docker-compose.prod.yml, the root nginx.conf overrides this.
upstream backend_api {
    server backend:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name ${DOMAIN} _;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/javascript text/xml image/svg+xml;

    # Frontend SPA
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # API proxy
    location /api/ {
        proxy_pass http://backend_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 200m;
        proxy_read_timeout 600s;
        proxy_buffering off;
    }

    # WebSocket proxy
    location /ws/ {
        proxy_pass http://backend_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400s;
    }
}
